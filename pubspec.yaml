name: loyalty_wallet
description: A Flutter app to store and manage loyalty cards
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  provider: ^6.1.1
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  # Firebase - temporarily disabled for web compatibility
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.15.3
  # cloud_firestore: ^4.13.6
  # firebase_messaging: ^14.7.9
  # Barcode & QR code
  barcode_widget: ^2.0.4
  flutter_barcode_scanner: ^2.0.0
  # Notifications
  flutter_local_notifications: ^15.1.0+1
  # Connectivity
  connectivity_plus: ^5.0.1
  # UI Components
  flutter_slidable: ^3.0.0
  cached_network_image: ^3.3.0
  # Encryption
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  # Image handling
  image_picker: ^1.0.4
  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  js: ^0.6.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
